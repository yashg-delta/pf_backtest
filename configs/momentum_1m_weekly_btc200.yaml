# 1-month momentum, weekly rebalance, BTC > 200 MA
name: "momentum_1m_weekly_btc200"

# Data loading configuration
data:
  required_columns:
    - SYMBOL
    - BAR_TIMESTAMP
    - CLOSE_PRICE
    - VOLUME
    - NOTIONAL_VOLUME
    - BUY_VOLUME
    - SELL_VOLUME

# Universe selection
universe:
  top_n: 50
  volume_lookback_days: 14
  min_data_coverage: 0.95

# Factor configuration
factor:
  name: "momentum"
  params:
    lookback_days: 30
    price_col: "CLOSE_PRICE"

# Selection criteria
selection:
  type: "top"
  top_n: 10

# Rebalancing
rebalance:
  frequency: "weekly"
  day: "monday"
  time: "00:00"

# Filters
filters:
  - type: "btc_ma"
    ma_period: 200

# Execution
execution:
  transaction_cost_bps: 3